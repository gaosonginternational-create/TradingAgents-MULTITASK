services:
  tradingagents:
    build: .
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      # 代理为可选：需要翻墙访问外网时，在 .env 里设置 HOST_PROXY（如
      # HOST_PROXY=http://host.docker.internal:10793）。默认不启用，开箱即用。
      - HTTP_PROXY=${HOST_PROXY:-}
      - HTTPS_PROXY=${HOST_PROXY:-}
      - http_proxy=${HOST_PROXY:-}
      - https_proxy=${HOST_PROXY:-}
      # 国内数据源（东财/新浪/巨潮/腾讯/同花顺）永远不走代理：它们本来就能直连，
      # 走代理反而会因 VPN 抖动一起挂掉（曾出现容器短暂失去到宿主代理的路由，
      # 东财全部 Network is unreachable）。NO_PROXY 与 no_proxy 两种拼写都设。
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,172.17.0.1,eastmoney.com,.eastmoney.com,sina.com.cn,.sina.com.cn,sina.com,.sina.com,gtimg.cn,.gtimg.cn,10jqka.com.cn,.10jqka.com.cn,hexun.com,.hexun.com,163.com,.163.com,xueqiu.com,.xueqiu.com,sse.com.cn,.sse.com.cn,szse.cn,.szse.cn,cninfo.com.cn,.cninfo.com.cn,qq.com,.qq.com,baidu.com,.baidu.com,ifeng.com,.ifeng.com,deepseek.com,.deepseek.com,stlouisfed.org,.stlouisfed.org,alphavantage.co,.alphavantage.co
      - no_proxy=localhost,127.0.0.1,host.docker.internal,172.17.0.1,eastmoney.com,.eastmoney.com,sina.com.cn,.sina.com.cn,sina.com,.sina.com,gtimg.cn,.gtimg.cn,10jqka.com.cn,.10jqka.com.cn,hexun.com,.hexun.com,163.com,.163.com,xueqiu.com,.xueqiu.com,sse.com.cn,.sse.com.cn,szse.cn,.szse.cn,cninfo.com.cn,.cninfo.com.cn,qq.com,.qq.com,baidu.com,.baidu.com,ifeng.com,.ifeng.com,deepseek.com,.deepseek.com,stlouisfed.org,.stlouisfed.org,alphavantage.co,.alphavantage.co
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    # 内存上限：防止容器内存失控拖垮整个 WSL 虚拟机（曾因此生成 123 GB 崩溃转储塞满 C 盘）。
    # 需要更大内存时自行调高。mem_limit 为物理内存，memswap_limit 为内存+交换总量。
    mem_limit: 8g
    memswap_limit: 12g
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      - ollama
    mem_limit: 8g
    memswap_limit: 12g
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
