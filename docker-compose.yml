services:
  tradingagents:
    build: .
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - HTTP_PROXY=http://host.docker.internal:10793
      - HTTPS_PROXY=http://host.docker.internal:10793
      - http_proxy=http://host.docker.internal:10793
      - https_proxy=http://host.docker.internal:10793
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,api.deepseek.com,.deepseek.com,api.stlouisfed.org,.stlouisfed.org,api.alphavantage.co,.alphavantage.co
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
